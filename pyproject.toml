[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "veriswarm"
version = "0.1.0"
description = "Model-checked isolation against lock-based agent communication. A research artifact, not a production sandbox."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]
report = ["pymupdf>=1.24"]
llm = ["anthropic>=2.6", "huggingface_hub>=2.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "tlc: needs Java and tools/tla2tools.jar",
]
